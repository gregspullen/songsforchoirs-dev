<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login — Songs for Choirs</title>

  <link rel="stylesheet" href="styles.css?v=999">

  <style>
    body.login-page .panel {
      width: 90%;
      max-width: 520px;
      margin: 3rem auto;
      padding: 2rem 2.5rem;
      display: block;
    }

    body.login-page input[type="email"] {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
    }

    body.login-page label {
      display: block;
      margin-top: 18px;
    }

    body.login-page .note {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-top: 1rem;
    }

    body.login-page button {
      margin-top: 1.5rem;
      width: 100%;
    }
    body.login-page .features {
    white-space: nowrap;
  }
  </style>
</head>

<body class="login-page">

<header class="site-header">
  <div class="wrap">
    <h1 class="site-logo">songs<span class="gold">for</span>choirs</h1>
    <p class="tagline">
      Sign in to access supporter discounts and choir downloads
    </p>
  </div>
</header>

<nav class="site-nav">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="sacred.html">Sacred</a></li>
    <li><a href="concert.html">Concert</a></li>
    <li><a href="albums.html">Sets</a></li>
    <li><a href="faq.html">FAQ</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="panel">

  <h2>Patrons</h2>

  <p class="note features">
  Supporters and choir directors can sign in to access:
</p>

<p class="note features">
  Discounts • Future downloads • Community features
</p>

  <form id="loginForm">

    <label for="email">
      Email address
    </label>

    <input
      type="email"
      id="email"
      name="email"
      placeholder="yourname@example.com"
      required
    >

    <button type="submit" class="price">
      Send me a login link
    </button>

  </form>

  <p class="note">
    We’ll send you a secure sign-in link by email.
  </p>

</div>

</body>
</html>
