<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- DATA -->
  <script src="data.js?v=1"></script>

  <script>
document.addEventListener("DOMContentLoaded", () => {

  // 🐸 Get slug from URL (no hardcoding now)
  const path = window.location.pathname;
  const slug = path
  .split("/")
  .pop()
  .replace(/^opus-/, "")
  .replace(/\.html$/, "");
  console.log("slug:", slug);

  // 🐸 Get piece
  const piece = (typeof PIECES !== "undefined") ? PIECES[slug] : null;

  // 🛑 Safety first
  if (!piece) {
    console.error("Piece not found:", slug);
    return;
  }

  // 🐸 Build metaTitle (your good idea, cleaned)
  if (piece.voicing && piece.accompaniment) {
    piece.metaTitle = `${piece.title} - for ${piece.voicing} Choir with ${piece.accompaniment} | Songs for Choirs`;
  }

  // 🐸 Set title
  document.title = piece.metaTitle || `${piece.title} — Songs for Choirs`;
  // 🐸 Cover image
  const cover = document.getElementById("coverImg");
  if (cover) {
    cover.src = `/images/Cover_png/${slug}.png`;
    cover.alt = `${piece.title} cover`;
  }
  
  // 🐸 Sheet link
  const sheetLink = document.getElementById("sheetLink");
  if (sheetLink) {
    sheetLink.href = `sheet-${slug}.html`;
  }

  // 🐸 Meta description
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc && piece.description) {
    metaDesc.setAttribute("content", piece.description);
  }
  // 🎵 Audio
const audio = document.querySelector("audio");
const audioSrc = document.getElementById("audioSrc");

const isLive = window.location.hostname === "songsforchoirs.com"
            || window.location.hostname === "www.songsforchoirs.com";

const audioBase = isLive
  ? "https://www.songsforchoirs.com"
  : "https://dev.songsforchoirs.net";

if (audio && audioSrc) {
  const src = `${audioBase}/mp3/${slug}.mp3`;
  audioSrc.src = src;
  audio.load();
  console.log("Audio src:", src);
}
  
  // 🪄 Order button
  const orderBtn = document.getElementById("orderBtn");
  if (orderBtn) {
    orderBtn.onclick = () => {
      window.location.href = `orderform.html?title=${encodeURIComponent(piece.title)}`;
    };
  }

});
</script>

  <link rel="stylesheet" href="styles.css">

  <!-- Analytics -->
  <script defer data-domain="songsforchoirs.com" src="https://plausible.io/js/script.js"></script>
</head>

<body class="opus-page">

  <header class="site-header">
    <h1 class="site-logo">
      songs<span class="gold">for</span>choirs
    </h1>
    <p class="tagline">New accessible choral music.</p>
  </header>

  <nav id="site-nav" class="site-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="choral.html">Choral</a></li>
      <li><a href="young-voices.html">Young-Voices</a></li>
      <li><a href="other.html">Other</a></li>
      <li><a href="news.html">News</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="wrap">
    <section class="panel">

      <div class="score-grid single-opus">
        
        <!-- Audio -->
        <div class="opus-left">
          <audio controls>
            <source id="audioSrc" type="audio/mpeg">
          </audio>
        </div>
        
        <!-- Cover -->
        <figure class="cover">
          <a id="sheetLink" class="cover-link">
            <img 
              id="coverImg"
              onerror="this.classList.add('placeholder'); this.src='images/placeholder.png';">
          </a>
          <span class="hover-tag">VIEW SAMPLE</span>
        </figure>

        <!-- Order -->
        <div class="opus-right">
          <div class="paypal-box">
            <button class="price"
              data-price="1.25"
              id="orderBtn"
              type="button">
              Order Here — £1.25 (<span class="eur"></span>, <span class="usd"></span>) per part
            </button>
          </div>
        </div>

      </div>

    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <small>© 2026 <a href="https://www.songsforchoirs.com">www.songsforchoirs.com</a></small>
    </div>
  </footer>

  <script src="pricing.js"></script>

</body>
</html>
