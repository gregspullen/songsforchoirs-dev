<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- DATA -->
  <script src="data.js"></script>

  <script>
    const slug = "lavenders-blue";

    const piece = PIECES[slug];

    const TITLE = piece.title;
    const DESCRIPTION = piece.description;

    document.title = `${TITLE} – Songs for Choirs`;
  </script>

  <meta name="description" content="">
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document
        .querySelector('meta[name="description"]')
        .setAttribute("content", DESCRIPTION);
    });
  </script>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="opus-page">

  <main class="wrap">
    <section class="panel">

      <div class="score-grid single-opus">
        
        <!-- AUDIO -->
        <div class="opus-left">
          <audio controls>
            <source id="audioSrc" type="audio/mpeg">
          </audio>
        </div>
        
        <!-- COVER -->
        <figure class="cover">
          <a id="sheetLink">
            <img id="coverImg">
          </a>
        </figure>

        <!-- ORDER BUTTON (NOW A LINK) -->
        <div class="opus-right">
          <div class="paypal-box">

            <a id="orderBtn" class="price" data-price="1.25">
              Order Here — £1.25
            </a>

          </div>
        </div>

      </div>

    </section>
  </main>

  <!-- WIRING -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const audio = document.querySelector("audio");

      document.getElementById("audioSrc").src =
        `https://www.songsforchoirs.com/mp3/${slug}.mp3`;
      audio.load();

      document.getElementById("sheetLink").href =
        `sheet-${slug}.html`;

      const cover = document.getElementById("coverImg");
      cover.src = `/images/Cover_png/${slug}.png`;

      // 🔥 THIS IS THE IMPORTANT BIT
      const btn = document.getElementById("orderBtn");

      btn.addEventListener("click", () => {
        window.location.href = `orderform?title=${encodeURIComponent(TITLE)}`;
      });

    });
  </script>

</body>
</html>
